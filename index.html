const MC={},GB=new THREE.BoxGeometry(1,1,1),mb=c=>MC["m"+c]||(MC["m"+c]=new THREE.MeshBasicMaterial({color:c}));
function part(g,w,h,d,c,x,y,z){const m=new THREE.Mesh(GB,mb(c));m.scale.set(w,h,d);m.position.set(x,y,z);g.add(m)}
function mkMan(sk,sh,pn,hat){const g=new THREE.Group(),L=[];for(const x of[-.14,.14]){const p=new THREE.Group();p.position.set(x,.7,0);part(p,.26,.7,.26,pn,0,-.35,0);g.add(p);L.push(p)}
part(g,.54,.7,.3,sh,0,1.05,0);part(g,.46,.46,.46,sk,0,1.62,0);if(hat){const c=new THREE.Mesh(new THREE.ConeGeometry(.36,.7,8),mb(hat));c.position.y=2.1;g.add(c)}g.userData.L=L;scene.add(g);return g}
const NPC=[];let witch=null,wT=0;
function gyF(x,z,y0,up,dn){x=Math.floor(x);z=Math.floor(z);if(x<1||z<1||x>=N-1||z>=N-1)return null;for(let y=Math.min(H-2,Math.floor(y0)+up);y>=Math.max(0,Math.floor(y0)-dn);y--){const b=W_[x+z*N+y*65536];if(b&&b!==11&&b!==33)return y+1}return null}
function addNpc(k,x,z,cx,cz,r,c){const h=hm[Math.floor(x)+Math.floor(z)*N],y=gyF(x,z,h+2,0,8);if(y===null)return;const g=mkMan(c.sk,c.sh,c.pn);g.position.set(x,y,z);NPC.push({g,x,y,z,tx:x,tz:z,cx,cz,r,w:Math.random()*3,go:0,k,sp:k=="bot"?2.4:1.4})}
const SK=[0xe0b48a,0xc68642,0x8d5524,0xf1c27d],SH=[0x2e7d32,0x1565c0,0xc62828,0xf9a825,0x6a1b9a,0x00838f,0xeeeeee],PN=[0x3a3a8a,0x333333,0x5d4037,0x455a64],pk=a=>a[rn(a.length)];
function spawnNpcs(){NPC.forEach(n=>scene.remove(n.g));NPC.length=0;
for(const [cx,cz] of VIL)for(let i=0;i<3;i++)addNpc("v",cx+(i%2?1:-1)*(3+rn(5)),cz,cx,cz,9,{sk:pk(SK),sh:0x7a5a3a,pn:0x4a3a2a});
for(const [x,z] of SM)addNpc("v",x,z,x,z,3,{sk:0xe0b48a,sh:0x444444,pn:0x222222});
let n=0,t=0;while(n<50&&t++<4000){const near=n<10,a=Math.random()*6.28,r=15+Math.random()*30,x=Math.floor(near?spawn.x+Math.cos(a)*r:10+rn(236)),z=Math.floor(near?spawn.z+Math.sin(a)*r:10+rn(236));if(x<5||z<5||x>N-5||z>N-5)continue;const h=hm[x+z*N];if(h<=SEA||W_[idx(x,h+1,z)]||W_[idx(x,h+2,z)])continue;const c=gyF(x,z,h+2,0,8);if(c===null||W_[idx(x,h,z)]===11)continue;addNpc("bot",x+.5,z+.5,x,z,20,{sk:pk(SK),sh:pk(SH),pn:pk(PN)});n++}}
function spawnWitch(){for(let t=0;t<8;t++){const a=Math.random()*6.28,x=P.x+Math.cos(a)*14,z=P.z+Math.sin(a)*14,y=gyF(x,z,P.y,6,10);if(y===null)continue;const g=mkMan(0xb6d49a,0x5b2a86,0x3a1a5a,0x3a1a5a);g.scale.setScalar(1.15);witch={g,x,y,z,t:0};flash(tr("wi"));return}}
function witchUpd(dt){const w=witch;if(!w)return;w.t+=dt;const dx=P.x-w.x,dz=P.z-w.z,l=Math.hypot(dx,dz)||1;
if(l<1.5&&Math.abs(P.y-w.y)<2.2){hurt(6);flash(tr("wh"));scene.remove(w.g);witch=null;return}
if(w.t>45){scene.remove(w.g);witch=null;return}
const nx=w.x+dx/l*3.3*dt,nz=w.z+dz/l*3.3*dt,ng=gyF(nx,nz,w.y,4,8);if(ng!==null){w.x=nx;w.z=nz;w.y+=(ng-w.y)*Math.min(1,dt*10)}
w.g.position.set(w.x,w.y,w.z);w.g.rotation.y=Math.atan2(dx,dz);const s=Math.sin(performance.now()/110)*.6;w.g.userData.L[0].rotation.x=s;w.g.userData.L[1].rotation.x=-s}
function npc(dt){const T0=performance.now()/1e3;wT+=dt;if(wT>=120){wT=0;if(!witch)spawnWitch()}witchUpd(dt);
for(const n of NPC){const dx=n.x-P.x,dz=n.z-P.z,d2=dx*dx+dz*dz;n.g.visible=d2<7000;if(d2>19600)continue;let mv=0;n.w-=dt;
if(!n.go&&n.w<=0){const a=Math.random()*6.28,r=4+Math.random()*(n.k=="bot"?20:n.r),bx=n.k=="bot"?n.x:n.cx,bz=n.k=="bot"?n.z:n.cz;n.tx=bx+Math.cos(a)*r;n.tz=bz+Math.sin(a)*r;n.go=1}
if(n.go){const ex=n.tx-n.x,ez=n.tz-n.z,l=Math.hypot(ex,ez);if(l<.5){n.go=0;n.w=1+Math.random()*4}else{const nx=n.x+ex/l*n.sp*dt,nz=n.z+ez/l*n.sp*dt,ng=gyF(nx,nz,n.y,3,4);if(ng===null||ng-n.y>1.1||ng-n.y<-3){n.go=0;n.w=.5}else{n.x=nx;n.z=nz;n.y+=(ng-n.y)*Math.min(1,dt*12);n.g.rotation.y=Math.atan2(ex,ez);mv=1}}}
n.g.position.set(n.x,n.y,n.z);const s=mv?Math.sin(T0*9+n.x)*.6:0;n.g.userData.L[0].rotation.x=s;n.g.userData.L[1].rotation.x=-s}}
let AC=null,mg=null,mi=0,mu=!!LS.get("mu");const NT=[261.63,293.66,329.63,392,440,523.25],PT=[0,2,4,2,1,3,5,3,0,2,4,5,3,2,1,0];
function tone(f,d,v){const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mg);o.start();o.stop(t+d)}
function music(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}mg=AC.createGain();mg.gain.value=mu?0:.6;mg.connect(AC.destination);
setInterval(()=>{if(AC.state!=="running"||mg.gain.value===0)return;const f=NT[PT[mi%16]];tone(f,1.1,.06);if(mi%4==0)tone(f/2,2.4,.05);mi++},600);document.addEventListener("visibilitychange",()=>document.hidden?AC.suspend():AC.resume())}
const mus=on=>{if(mg)mg.gain.value=(on&&!mu)?0.6:0};
$("#mu").textContent=mu?"🔇":"🔊";$("#mu").onclick=()=>{mu=!mu;LS.set("mu",mu);$("#mu").textContent=mu?"🔇":"🔊";music();mus(1)};
